<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司开源抽奖转盘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"SimSun","宋体",serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:15px;color:#fff}
h1{font-family:"SimSun","宋体",serif;font-size:32px;margin-bottom:4px;text-shadow:2px 2px 4px rgba(0,0,0,.5);letter-spacing:6px}
.subtitle{font-size:13px;color:#aaa;margin-bottom:12px;letter-spacing:2px}
.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1100px;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.top-left{display:flex;align-items:center;gap:12px}
.user-info{display:none;gap:10px;align-items:center;background:rgba(0,0,0,.3);padding:6px 14px;border-radius:20px;border:1px solid rgba(255,215,0,.2);font-size:13px}
.user-info.show{display:flex}
.user-info span{color:#ffd700}
.current-time{font-size:12px;color:#888;margin-top:1px}
.logout-btn{background:rgba(255,100,100,.2);border:1px solid rgba(255,100,100,.3);color:#ff8888;padding:3px 10px;border-radius:10px;cursor:pointer;font-family:"SimSun","宋体",serif;font-size:11px;transition:all .3s}
.logout-btn:hover{background:rgba(255,100,100,.4)}
.top-right{display:flex;align-items:center;gap:8px}
.points-display{background:linear-gradient(145deg,rgba(78,205,196,.2),rgba(69,183,209,.2));border:1px solid rgba(78,205,196,.4);padding:6px 14px;border-radius:18px;font-size:14px;display:none;align-items:center;gap:5px}
.points-display .label{color:#4ecdc4;font-size:12px}
.points-display .value{color:#4ecdc4;font-weight:bold;font-size:16px}
.main-container{display:flex;gap:25px;align-items:flex-start;max-width:1100px;width:100%;justify-content:center;flex-wrap:wrap}
.left-section{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheel-container{position:relative;width:380px;height:380px}
#wheelCanvas{width:380px;height:380px}
.pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:26px solid #ff4444;z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.pointer::after{content:"";position:absolute;top:-30px;left:-7px;width:14px;height:14px;background:#ff4444;border-radius:50%}
.center-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#ff6b6b,#ee5a5a);border:3px solid #fff;color:#fff;font-family:"SimSun","宋体",serif;font-size:24px;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.4),inset 0 2px 5px rgba(255,255,255,.3);transition:all .2s;z-index:20;display:flex;align-items:center;justify-content:center}
.center-btn:hover{transform:translate(-50%,-50%) scale(1.05);box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 2px 5px rgba(255,255,255,.4)}
.center-btn:active{transform:translate(-50%,-50%) scale(.95)}
.center-btn:disabled{background:linear-gradient(145deg,#888,#666);cursor:not-allowed;transform:translate(-50%,-50%) scale(1)}
.center-btn.spinning{animation:pulse .5s infinite alternate}
@keyframes pulse{from{box-shadow:0 4px 15px rgba(255,107,107,.4)}to{box-shadow:0 4px 25px rgba(255,107,107,.8)}}
.wheel-outer-ring{position:absolute;top:-8px;left:-8px;right:-8px;bottom:-8px;border:6px solid #ffd700;border-radius:50%;box-shadow:0 0 20px rgba(255,215,0,.3),inset 0 0 20px rgba(255,215,0,.1);pointer-events:none}
.daily-limit-msg{color:#ff6b6b;font-size:13px;margin-top:6px;text-align:center;min-height:18px}
.note-section{margin-top:10px;text-align:center;font-family:"SimSun","宋体",serif;font-size:13px;line-height:2;color:#ffd700;background:rgba(0,0,0,.3);padding:12px 20px;border-radius:10px;border:1px solid rgba(255,215,0,.3)}
.note-section p{margin:1px 0}
.prob-tag{display:inline-block;background:rgba(255,215,0,.15);padding:1px 6px;border-radius:8px;font-size:11px;margin-left:4px;border:1px solid rgba(255,215,0,.3)}
.rules-panel{background:rgba(0,0,0,.25);border:1px solid rgba(255,215,0,.2);border-radius:10px;padding:12px 16px;width:100%;max-width:380px;font-size:12px;line-height:1.8;color:#ccc}
.rules-panel .rules-title{color:#ffd700;font-size:14px;font-weight:bold;margin-bottom:6px;text-align:center}
.rules-panel strong{color:#ffd700}
.vouchers-panel{background:rgba(0,0,0,.25);border:1px solid rgba(255,215,0,.2);border-radius:10px;padding:12px 16px;width:100%;max-width:380px;display:none}
.vouchers-panel .vouchers-title{color:#ffd700;font-size:14px;font-weight:bold;margin-bottom:8px;text-align:center}
.voucher-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto}
.voucher-list::-webkit-scrollbar{width:4px}
.voucher-list::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
.voucher-list::-webkit-scrollbar-thumb{background:rgba(255,215,0,.4);border-radius:2px}
.voucher-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;font-size:12px;border-left:3px solid}
.voucher-item.first{background:rgba(255,215,0,.15);border-left-color:#ffd700}
.voucher-item.second{background:rgba(192,192,192,.15);border-left-color:#c0c0c0}
.voucher-item.third{background:rgba(205,127,50,.15);border-left-color:#cd7f32}
.voucher-item .v-code{font-family:"Courier New",monospace;font-size:10px;color:#888;word-break:break-all}
.voucher-item .v-amount{font-weight:bold;font-size:13px}
.voucher-item.first .v-amount{color:#ffd700}
.voucher-item.second .v-amount{color:#c0c0c0}
.voucher-item.third .v-amount{color:#cd7f32}
.voucher-item .v-expire{font-size:10px;color:#777}
.voucher-item .v-expire.soon{color:#ff6b6b}
.voucher-item .v-expire.expired{color:#666;text-decoration:line-through}
.voucher-item .v-status{font-size:10px;padding:1px 5px;border-radius:3px}
.v-status.valid{background:rgba(76,175,80,.2);color:#4caf50}
.v-status.used{background:rgba(153,153,153,.2);color:#999}
.v-status.expired{background:rgba(255,100,100,.2);color:#ff6b6b}
.no-vouchers{text-align:center;color:#666;padding:15px;font-size:12px}
.bill-panel{background:rgba(0,0,0,.25);border:1px solid rgba(78,205,196,.2);border-radius:10px;padding:12px 16px;width:100%;max-width:380px;display:none}
.bill-panel .bill-title{color:#4ecdc4;font-size:14px;font-weight:bold;margin-bottom:8px;text-align:center}
.bill-list{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto}
.bill-list::-webkit-scrollbar{width:4px}
.bill-list::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
.bill-list::-webkit-scrollbar-thumb{background:rgba(78,205,196,.4);border-radius:2px}
.bill-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:6px;font-size:12px;background:rgba(0,0,0,.15)}
.bill-item .bill-time{color:#888;font-size:10px}
.bill-item .bill-reason{color:#ccc;flex:1;margin:0 8px}
.bill-item .bill-amount{font-weight:bold;font-size:13px}
.bill-item .bill-amount.income{color:#4caf50}
.bill-item .bill-amount.expense{color:#ff6b6b}
.no-bill{text-align:center;color:#666;padding:15px;font-size:12px}
.record-section{width:280px;min-height:480px;background:rgba(0,0,0,.4);border-radius:15px;border:2px solid rgba(255,215,0,.3);padding:18px;backdrop-filter:blur(10px)}
.record-title{font-family:"SimSun","宋体",serif;font-size:20px;text-align:center;margin-bottom:12px;color:#ffd700;border-bottom:2px solid rgba(255,215,0,.3);padding-bottom:8px}
.record-list{max-height:380px;overflow-y:auto}
.record-list::-webkit-scrollbar{width:5px}
.record-list::-webkit-scrollbar-track{background:rgba(0,0,0,.2);border-radius:3px}
.record-list::-webkit-scrollbar-thumb{background:rgba(255,215,0,.5);border-radius:3px}
.record-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:6px;font-size:13px;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.record-item.thanks{background:rgba(100,100,100,.3);border-left:3px solid #888}
.record-item.third{background:rgba(205,127,50,.3);border-left:3px solid #cd7f32}
.record-item.second{background:rgba(192,192,192,.3);border-left:3px solid #c0c0c0}
.record-item.first{background:rgba(255,215,0,.3);border-left:3px solid #ffd700}
.record-time{font-size:10px;color:#aaa}
.record-prize{font-weight:bold}
.record-item.thanks .record-prize{color:#aaa}
.record-item.third .record-prize{color:#cd7f32}
.record-item.second .record-prize{color:#c0c0c0}
.record-item.first .record-prize{color:#ffd700}
.clear-btn{margin-top:12px;width:100%;padding:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#aaa;border-radius:6px;cursor:pointer;font-family:"SimSun","宋体",serif;font-size:13px;transition:all .3s}
.clear-btn:hover{background:rgba(255,100,100,.2);color:#ff8888;border-color:rgba(255,100,100,.3)}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:200;justify-content:center;align-items:center;backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{background:linear-gradient(145deg,#2a2a4a,#1a1a3e);border:3px solid #ffd700;border-radius:20px;padding:25px 35px;width:400px;max-width:90vw;box-shadow:0 0 50px rgba(255,215,0,.3);animation:popIn .5s cubic-bezier(.68,-.55,.265,1.55)}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-family:"SimSun","宋体",serif;font-size:20px;text-align:center;margin-bottom:4px;color:#ffd700}
.warning-text{text-align:center;color:#ff6b6b;font-size:12px;margin-bottom:15px;padding:6px;background:rgba(255,100,100,.1);border-radius:6px;border:1px solid rgba(255,100,100,.2)}
.step-indicator{display:flex;justify-content:center;gap:6px;margin-bottom:15px}
.step-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}
.step-dot.active{background:#ffd700;box-shadow:0 0 6px rgba(255,215,0,.5)}
.step-dot.done{background:#4ecdc4}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:13px;color:#ccc;margin-bottom:4px}
.form-input{width:100%;padding:10px 12px;border:1px solid rgba(255,215,0,.3);border-radius:8px;background:rgba(0,0,0,.3);color:#fff;font-family:"SimSun","宋体",serif;font-size:14px;outline:none;transition:all .3s}
.form-input:focus{border-color:#ffd700;box-shadow:0 0 8px rgba(255,215,0,.2)}
.form-input::placeholder{color:#666}
.code-row{display:flex;gap:8px}
.code-row .form-input{flex:1}
.code-btn{padding:0 14px;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:8px;color:#1a1a2e;font-family:"SimSun","宋体",serif;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:all .3s}
.code-btn:hover:not(:disabled){transform:scale(1.02);box-shadow:0 3px 10px rgba(255,215,0,.4)}
.code-btn:disabled{background:#555;color:#888;cursor:not-allowed}
.submit-btn{width:100%;padding:12px;margin-top:8px;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:10px;color:#1a1a2e;font-family:"SimSun","宋体",serif;font-size:16px;font-weight:bold;cursor:pointer;transition:all .3s;letter-spacing:3px}
.submit-btn:hover{transform:scale(1.02);box-shadow:0 5px 15px rgba(255,215,0,.4)}
.submit-btn:disabled{background:#555;color:#888;cursor:not-allowed;transform:none;box-shadow:none}
.error-msg{color:#ff6b6b;font-size:12px;margin-top:4px;text-align:center;min-height:16px}
.result-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(5px)}
.result-modal.show{display:flex;animation:fadeIn .3s ease}
.result-content{background:linear-gradient(145deg,#2a2a4a,#1a1a3e);border:3px solid #ffd700;border-radius:20px;padding:35px 50px;text-align:center;box-shadow:0 0 50px rgba(255,215,0,.3);animation:popIn .5s cubic-bezier(.68,-.55,.265,1.55)}
.result-title{font-family:"SimSun","宋体",serif;font-size:26px;margin-bottom:15px}
.result-title.thanks{color:#888}
.result-title.third{color:#cd7f32}
.result-title.second{color:#c0c0c0}
.result-title.first{color:#ffd700}
.result-desc{font-size:16px;margin-bottom:20px;color:#ddd;line-height:1.6}
.download-btn{padding:10px 25px;background:linear-gradient(145deg,#ffd700,#ffaa00);border:none;border-radius:20px;color:#1a1a2e;font-family:"SimSun","宋体",serif;font-size:15px;font-weight:bold;cursor:pointer;margin:4px;transition:all .3s}
.download-btn:hover{transform:scale(1.05);box-shadow:0 5px 15px rgba(255,215,0,.4)}
.close-btn{padding:10px 25px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:20px;color:#fff;font-family:"SimSun","宋体",serif;font-size:15px;cursor:pointer;margin:4px;transition:all .3s}
.close-btn:hover{background:rgba(255,255,255,.2)}
.confetti{position:fixed;width:8px;height:8px;pointer-events:none;z-index:99}
@media(max-width:768px){.main-container{flex-direction:column;align-items:center}.record-section{width:100%;max-width:380px}.wheel-container{width:300px;height:300px}#wheelCanvas{width:300px;height:300px}.modal-box{padding:20px 18px;width:340px}.top-bar{flex-direction:column;align-items:center}}
</style>
</head>
<body>
<h1>幸运大转盘</h1>
<p class="subtitle">公司开源抽奖程序 · 公平公正公开</p>
<div class="top-bar">
<div class="top-left">
<div class="user-info" id="userInfoBar">
<span id="userNameDisplay"></span>
<span id="userPhoneDisplay"></span>
<div class="current-time" id="headerTime"></div>
<button class="logout-btn" onclick="logout()">退出</button>
</div>
</div>
<div class="top-right">
<div class="points-display" id="pointsDisplay">
<span class="label">积分</span>
<span class="value" id="pointsValue">0</span>
</div>
</div>
</div>
<div class="main-container">
<div class="left-section">
<div class="wheel-container">
<div class="wheel-outer-ring"></div>
<canvas id="wheelCanvas" width="380" height="380"></canvas>
<div class="pointer"></div>
<button class="center-btn" id="spinBtn" onclick="spin()">Go</button>
</div>
<div class="daily-limit-msg" id="dailyLimitMsg"></div>
<div class="rules-panel">
<div class="rules-title">积分规则</div>
<p><strong>获取：</strong>消费1元得2积分，代金券抵扣不计入。</p>
<p><strong>有效期：</strong>积分30天，代金券90天。</p>
<p><strong>兑换：</strong>50分→2元券 · 100分→5元券 · 180分→10元券 · 20分→抽奖1次。</p>
<p><strong>限制：</strong>每次最多使用一张代金券，不可找零。</p>
</div>
<div class="vouchers-panel" id="vouchersPanel">
<div class="vouchers-title">我的代金券</div>
<div class="voucher-list" id="voucherList"></div>
</div>
<div class="bill-panel" id="billPanel">
<div class="bill-title">收支账单</div>
<div class="bill-list" id="billList"></div>
</div>
<div class="note-section">
<p>注：一等奖10元<span class="prob-tag">概率3%</span></p>
<p>二等奖5元<span class="prob-tag">概率7%</span></p>
<p>三等奖2元<span class="prob-tag">概率15%</span></p>
<p>谢谢惠顾<span class="prob-tag">概率75%</span></p>
<p style="margin-top:4px;color:#ff6b6b;font-size:12px">每次最多使用一张代金券 · 每次抽奖消耗20积分</p>
</div>
</div>
<div class="record-section">
<div class="record-title">中奖记录</div>
<div class="record-list" id="recordList"></div>
<button class="clear-btn" onclick="clearRecords()">清空记录</button>
</div>
</div>
<div class="modal-overlay" id="authModal">
<div class="modal-box">
<div class="modal-title" id="authTitle">用户认证</div>
<div class="warning-text">⚠ 请务必如实填写个人信息，否则抽奖结果无效</div>
<div class="step-indicator">
<div class="step-dot active" id="dot1"></div>
<div class="step-dot" id="dot2"></div>
<div class="step-dot" id="dot3"></div>
</div>
<div id="step1">
<div class="form-group">
<label class="form-label">手机号码</label>
<input type="tel" class="form-input" id="phoneInput" placeholder="请输入11位手机号" maxlength="11">
</div>
<div class="form-group">
<label class="form-label">验证码</label>
<div class="code-row">
<input type="text" class="form-input" id="codeInput" placeholder="请输入验证码" maxlength="6">
<button class="code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
</div>
</div>
<div class="error-msg" id="step1Error"></div>
<button class="submit-btn" onclick="goStep2()">下一步</button>
</div>
<div id="step2" style="display:none">
<div class="form-group">
<label class="form-label">真实姓名</label>
<input type="text" class="form-input" id="nameInput" placeholder="请输入真实姓名" maxlength="10">
</div>
<div class="form-group">
<label class="form-label">身份证号</label>
<input type="text" class="form-input" id="idcardInput" placeholder="请输入身份证号" maxlength="18">
</div>
<div class="error-msg" id="step2Error"></div>
<button class="submit-btn" onclick="goStep3()">下一步</button>
</div>
<div id="step3" style="display:none">
<div style="text-align:center;color:#ccc;line-height:1.8;margin-bottom:15px;font-size:14px">
<p>手机号：<span id="confirmPhone" style="color:#ffd700"></span></p>
<p>姓名：<span id="confirmName" style="color:#ffd700"></span></p>
<p>身份证：<span id="confirmIdcard" style="color:#ffd700"></span></p>
</div>
<div class="error-msg" id="step3Error"></div>
<button class="submit-btn" onclick="completeAuth()">确认认证</button>
</div>
</div>
</div>
<div class="result-modal" id="resultModal">
<div class="result-content">
<div class="result-title" id="resultTitle"></div>
<div class="result-desc" id="resultDesc"></div>
<div id="resultButtons"></div>
</div>
</div>
<script>
(function(){
"use strict";
var _k={AUTH:"lottery_auth_v3",RECORDS:"lottery_records_v3",LAST_SPIN:"lottery_last_spin_v3",POINTS:"lottery_points_v3",POINTS_LOG:"lottery_points_log_v3",VOUCHERS:"lottery_vouchers_v3"};

_ss.forEach(function(s){_sb[s.t].push(s.idx)});

function _g(k){try{var d=localStorage.getItem(k);return d?JSON.parse(d):null}catch(e){return null}}
