<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司开源抽奖转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "SimSun", "宋体", serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        h1 {
            font-family: "SimSun", "宋体", serif;
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .user-info {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 10px 25px;
            border-radius: 25px;
            border: 1px solid rgba(255,215,0,0.2);
            font-size: 14px;
        }

        .user-info span {
            color: #ffd700;
        }

        .logout-btn {
            background: rgba(255,100,100,0.2);
            border: 1px solid rgba(255,100,100,0.3);
            color: #ff8888;
            padding: 4px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: "SimSun", "宋体", serif;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255,100,100,0.4);
        }

        .main-container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel-container {
            position: relative;
            width: 420px;
            height: 420px;
        }

        #wheelCanvas {
            width: 420px;
            height: 420px;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff4444;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .pointer::after {
            content: "";
            position: absolute;
            top: -35px;
            left: -8px;
            width: 16px;
            height: 16px;
            background: #ff4444;
            border-radius: 50%;
        }

        .center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ff6b6b, #ee5a5a);
            border: 4px solid #fff;
            color: #fff;
            font-family: "SimSun", "宋体", serif;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4), inset 0 2px 5px rgba(255,255,255,0.3);
            transition: all 0.2s ease;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .center-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.4);
        }

        .center-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .center-btn:disabled {
            background: linear-gradient(145deg, #888, #666);
            cursor: not-allowed;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-btn.spinning {
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 4px 15px rgba(255,107,107,0.4); }
            to { box-shadow: 0 4px 25px rgba(255,107,107,0.8); }
        }

        .wheel-outer-ring {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 8px solid #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,215,0,0.3), inset 0 0 20px rgba(255,215,0,0.1);
            pointer-events: none;
        }

        .note-section {
            margin-top: 25px;
            text-align: center;
            font-family: "SimSun", "宋体", serif;
            font-size: 15px;
            line-height: 2.2;
            color: #ffd700;
            background: rgba(0,0,0,0.3);
            padding: 18px 35px;
            border-radius: 10px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .note-section p {
            margin: 3px 0;
        }

        .prob-tag {
            display: inline-block;
            background: rgba(255,215,0,0.15);
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 13px;
            margin-left: 6px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .record-section {
            width: 300px;
            min-height: 520px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            border: 2px solid rgba(255,215,0,0.3);
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .record-title {
            font-family: "SimSun", "宋体", serif;
            font-size: 22px;
            text-align: center;
            margin-bottom: 15px;
            color: #ffd700;
            border-bottom: 2px solid rgba(255,215,0,0.3);
            padding-bottom: 10px;
        }

        .record-list {
            max-height: 420px;
            overflow-y: auto;
        }

        .record-list::-webkit-scrollbar {
            width: 6px;
        }

        .record-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 3px;
        }

        .record-list::-webkit-scrollbar-thumb {
            background: rgba(255,215,0,0.5);
            border-radius: 3px;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .record-item.thanks {
            background: rgba(100,100,100,0.3);
            border-left: 3px solid #888;
        }

        .record-item.third {
            background: rgba(205,127,50,0.3);
            border-left: 3px solid #cd7f32;
        }

        .record-item.second {
            background: rgba(192,192,192,0.3);
            border-left: 3px solid #c0c0c0;
        }

        .record-item.first {
            background: rgba(255,215,0,0.3);
            border-left: 3px solid #ffd700;
            animation: glow 1s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(255,215,0,0.3); }
            to { box-shadow: 0 0 15px rgba(255,215,0,0.6); }
        }

        .record-time {
            font-size: 11px;
            color: #aaa;
        }

        .record-prize {
            font-weight: bold;
        }

        .record-item.thanks .record-prize { color: #aaa; }
        .record-item.third .record-prize { color: #cd7f32; }
        .record-item.second .record-prize { color: #c0c0c0; }
        .record-item.first .record-prize { color: #ffd700; }

        .clear-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #aaa;
            border-radius: 8px;
            cursor: pointer;
            font-family: "SimSun", "宋体", serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: rgba(255,100,100,0.2);
            color: #ff8888;
            border-color: rgba(255,100,100,0.3);
        }

        /* ===== 弹窗通用样式 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-box {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3e);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 35px 45px;
            width: 420px;
            max-width: 90vw;
            box-shadow: 0 0 50px rgba(255,215,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .modal-title {
            font-family: "SimSun", "宋体", serif;
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
            color: #ffd700;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-family: "SimSun", "宋体", serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255,215,0,0.2);
        }

        .form-input::placeholder {
            color: #666;
        }

        .code-row {
            display: flex;
            gap: 10px;
        }

        .code-row .form-input {
            flex: 1;
        }

        .code-btn {
            padding: 0 18px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-family: "SimSun", "宋体", serif;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .code-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 3px 12px rgba(255,215,0,0.4);
        }

        .code-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 12px;
            color: #1a1a2e;
            font-family: "SimSun", "宋体", serif;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 4px;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }

        .submit-btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 5px;
            text-align: center;
            min-height: 18px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            background: #ffd700;
            box-shadow: 0 0 8px rgba(255,215,0,0.5);
        }

        .step-dot.done {
            background: #4ecdc4;
        }

        /* 结果弹窗 */
        .result-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .result-modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .result-content {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3e);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255,215,0,0.3);
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .result-title {
            font-family: "SimSun", "宋体", serif;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .result-title.thanks { color: #888; }
        .result-title.third { color: #cd7f32; }
        .result-title.second { color: #c0c0c0; }
        .result-title.first { color: #ffd700; }

        .result-desc {
            font-size: 18px;
            margin-bottom: 25px;
            color: #ddd;
        }

        .download-btn {
            padding: 12px 30px;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 25px;
            color: #1a1a2e;
            font-family: "SimSun", "宋体", serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }

        .close-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            color: #fff;
            font-family: "SimSun", "宋体", serif;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(0,0,0,0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-item span {
            font-weight: bold;
            margin-left: 5px;
        }

        .stat-thanks span { color: #888; }
        .stat-third span { color: #cd7f32; }
        .stat-second span { color: #c0c0c0; }
        .stat-first span { color: #ffd700; }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            z-index: 99;
        }

        .daily-limit-msg {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .record-section {
                width: 100%;
                max-width: 420px;
            }
            .wheel-container {
                width: 320px;
                height: 320px;
            }
            #wheelCanvas {
                width: 320px;
                height: 320px;
            }
            .modal-box {
                padding: 25px 20px;
                width: 340px;
            }
        }
    </style>
</head>
<body>
    <h1>幸运大转盘</h1>
    <p class="subtitle">公司开源抽奖程序 · 公平公正公开</p>

    <div class="user-info" id="userInfoBar" style="display:none;">
        <span id="userNameDisplay"></span>
        <span id="userPhoneDisplay"></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>

    <div class="stats-bar">
        <div class="stat-item stat-first">一等奖 <span id="statFirst">0</span></div>
        <div class="stat-item stat-second">二等奖 <span id="statSecond">0</span></div>
        <div class="stat-item stat-third">三等奖 <span id="statThird">0</span></div>
        <div class="stat-item stat-thanks">谢谢惠顾 <span id="statThanks">0</span></div>
    </div>

    <div class="main-container">
        <div class="wheel-section">
            <div class="wheel-container">
                <div class="wheel-outer-ring"></div>
                <canvas id="wheelCanvas" width="420" height="420"></canvas>
                <div class="pointer"></div>
                <button class="center-btn" id="spinBtn" onclick="spin()">Go</button>
            </div>
            <div class="daily-limit-msg" id="dailyLimitMsg"></div>

            <div class="note-section">
                <p>注：一等奖为10元代金券<span class="prob-tag">中奖概率3%</span></p>
                <p>二等奖为5元代金券<span class="prob-tag">中奖概率7%</span></p>
                <p>三等奖为2元代金券<span class="prob-tag">中奖概率15%</span></p>
                <p>谢谢惠顾<span class="prob-tag">中奖概率75%</span></p>
                <p style="margin-top:8px;color:#ff6b6b;font-size:13px;">每次最多使用一张代金券</p>
            </div>
        </div>

        <div class="record-section">
            <div class="record-title">中奖记录</div>
            <div class="record-list" id="recordList"></div>
            <button class="clear-btn" onclick="clearRecords()">清空记录</button>
        </div>
    </div>

    <!-- ===== 认证弹窗 ===== -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-box">
            <div class="modal-title" id="authTitle">用户认证</div>
            <div class="step-indicator" id="stepIndicator">
                <div class="step-dot active" id="dot1"></div>
                <div class="step-dot" id="dot2"></div>
                <div class="step-dot" id="dot3"></div>
            </div>

            <!-- 步骤1：手机号+验证码 -->
            <div id="step1">
                <div class="form-group">
                    <label class="form-label">手机号码</label>
                    <input type="tel" class="form-input" id="phoneInput" placeholder="请输入11位手机号" maxlength="11">
                </div>
                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="code-row">
                        <input type="text" class="form-input" id="codeInput" placeholder="请输入验证码" maxlength="6">
                        <button class="code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                    </div>
                </div>
                <div class="error-msg" id="step1Error"></div>
                <button class="submit-btn" onclick="goStep2()">下一步</button>
            </div>

            <!-- 步骤2：实名认证 -->
            <div id="step2" style="display:none;">
                <div class="form-group">
                    <label class="form-label">真实姓名</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="请输入真实姓名" maxlength="10">
                </div>
                <div class="form-group">
                    <label class="form-label">身份证号</label>
                    <input type="text" class="form-input" id="idcardInput" placeholder="请输入18位身份证号" maxlength="18">
                </div>
                <div class="error-msg" id="step2Error"></div>
                <button class="submit-btn" onclick="goStep3()">下一步</button>
            </div>

            <!-- 步骤3：确认 -->
            <div id="step3" style="display:none;">
                <div style="text-align:center;color:#ccc;line-height:2;margin-bottom:20px;">
                    <p>手机号：<span id="confirmPhone" style="color:#ffd700;"></span></p>
                    <p>姓名：<span id="confirmName" style="color:#ffd700;"></span></p>
                    <p>身份证：<span id="confirmIdcard" style="color:#ffd700;"></span></p>
                </div>
                <div class="error-msg" id="step3Error"></div>
                <button class="submit-btn" onclick="completeAuth()">确认认证</button>
            </div>
        </div>
    </div>

    <!-- 结果弹窗 -->
    <div class="result-modal" id="resultModal">
        <div class="result-content">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-desc" id="resultDesc"></div>
            <div id="resultButtons"></div>
        </div>
    </div>

    <script>
        // ===== 存储键名 =====
        const STORAGE_KEY = 'lottery_records_v3';
        const AUTH_KEY = 'lottery_auth_v3';
        const LAST_SPIN_KEY = 'lottery_last_spin_v3';

        // ===== 当前认证状态 =====
        let authData = { phone: '', code: '', name: '', idcard: '' };
        let sentCode = '';
        let codeCountdown = 0;

        // ===== 页面加载时检查认证状态 =====
        window.onload = function() {
            drawWheel();
            checkAuth();
            renderRecords();
            updateStats();
        };

        // ===== 检查认证状态 =====
        function checkAuth() {
            const auth = getAuth();
            if (auth && auth.phone && auth.name && auth.idcard) {
                showUserInfo(auth);
                checkDailyLimit();
            } else {
                showAuthModal();
            }
        }

        function getAuth() {
            try {
                const data = localStorage.getItem(AUTH_KEY);
                return data ? JSON.parse(data) : null;
            } catch (e) { return null; }
        }

        function saveAuth(data) {
            localStorage.setItem(AUTH_KEY, JSON.stringify(data));
        }

        function showUserInfo(auth) {
            document.getElementById('userInfoBar').style.display = 'flex';
            document.getElementById('userNameDisplay').textContent = auth.name;
            document.getElementById('userPhoneDisplay').textContent = maskPhone(auth.phone);
        }

        function maskPhone(phone) {
            return phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
        }

        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem(AUTH_KEY);
                localStorage.removeItem(LAST_SPIN_KEY);
                location.reload();
            }
        }

        // ===== 显示/隐藏认证弹窗 =====
        function showAuthModal() {
            document.getElementById('authModal').classList.add('show');
            resetAuthForm();
        }

        function hideAuthModal() {
            document.getElementById('authModal').classList.remove('show');
        }

        function resetAuthForm() {
            authData = { phone: '', code: '', name: '', idcard: '' };
            sentCode = '';
            document.getElementById('phoneInput').value = '';
            document.getElementById('codeInput').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('idcardInput').value = '';
            document.getElementById('step1Error').textContent = '';
            document.getElementById('step2Error').textContent = '';
            document.getElementById('step3Error').textContent = '';
            showStep(1);
        }

        function showStep(n) {
            document.getElementById('step1').style.display = n === 1 ? 'block' : 'none';
            document.getElementById('step2').style.display = n === 2 ? 'block' : 'none';
            document.getElementById('step3').style.display = n === 3 ? 'block' : 'none';

            for (let i = 1; i <= 3; i++) {
                const dot = document.getElementById('dot' + i);
                dot.className = 'step-dot';
                if (i < n) dot.classList.add('done');
                if (i === n) dot.classList.add('active');
            }

            const titles = ['用户认证', '实名认证', '确认信息'];
            document.getElementById('authTitle').textContent = titles[n - 1];
        }

        // ===== 发送验证码 =====
        function sendCode() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                document.getElementById('step1Error').textContent = '请输入正确的11位手机号';
                return;
            }

            // 生成6位随机验证码
            sentCode = Math.floor(100000 + Math.random() * 900000).toString();

            // 模拟发送（实际项目中这里调用短信API）
            alert('验证码已发送至 ' + maskPhone(phone) + '\n【模拟演示】验证码：' + sentCode);

            // 倒计时
            codeCountdown = 60;
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = codeCountdown + '秒后重发';

            const timer = setInterval(() => {
                codeCountdown--;
                if (codeCountdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                } else {
                    btn.textContent = codeCountdown + '秒后重发';
                }
            }, 1000);

            document.getElementById('step1Error').textContent = '';
        }

        // ===== 步骤1验证 =====
        function goStep2() {
            const phone = document.getElementById('phoneInput').value.trim();
            const code = document.getElementById('codeInput').value.trim();

            if (!/^1[3-9]\d{9}$/.test(phone)) {
                document.getElementById('step1Error').textContent = '请输入正确的11位手机号';
                return;
            }
            if (!sentCode) {
                document.getElementById('step1Error').textContent = '请先获取验证码';
                return;
            }
            if (code !== sentCode) {
                document.getElementById('step1Error').textContent = '验证码错误，请重新输入';
                return;
            }

            authData.phone = phone;
            authData.code = code;
            document.getElementById('step1Error').textContent = '';
            showStep(2);
        }

        // ===== 步骤2验证 =====
        function goStep3() {
            const name = document.getElementById('nameInput').value.trim();
            const idcard = document.getElementById('idcardInput').value.trim().toUpperCase();

            if (!name || name.length < 2) {
                document.getElementById('step2Error').textContent = '请输入真实姓名（至少2个字）';
                return;
            }
            if (!/^\d{17}[\dX]$/.test(idcard)) {
                document.getElementById('step2Error').textContent = '请输入正确的18位身份证号';
                return;
            }

            // 简单校验身份证最后一位
            const weights = [7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];
            const checkCodes = ['1','0','X','9','8','7','6','5','4','3','2'];
            let sum = 0;
            for (let i = 0; i < 17; i++) {
                sum += parseInt(idcard[i]) * weights[i];
            }
            if (idcard[17] !== checkCodes[sum % 11]) {
                document.getElementById('step2Error').textContent = '身份证号校验失败，请检查输入';
                return;
            }

            authData.name = name;
            authData.idcard = idcard;
            document.getElementById('step2Error').textContent = '';

            // 显示确认信息
            document.getElementById('confirmPhone').textContent = maskPhone(authData.phone);
            document.getElementById('confirmName').textContent = authData.name;
            document.getElementById('confirmIdcard').textContent = authData.idcard.replace(/(\d{6})\d{8}(\d{4})/, '$1********$2');
            showStep(3);
        }

        // ===== 完成认证 =====
        function completeAuth() {
            saveAuth(authData);
            hideAuthModal();
            showUserInfo(authData);
            checkDailyLimit();
        }

        // ===== 每日抽奖限制 =====
        function checkDailyLimit() {
            const auth = getAuth();
            if (!auth) return;

            const today = new Date().toLocaleDateString('zh-CN');
            const lastSpin = localStorage.getItem(LAST_SPIN_KEY + '_' + auth.phone);
            const msgEl = document.getElementById('dailyLimitMsg');
            const btn = document.getElementById('spinBtn');

            if (lastSpin === today) {
                msgEl.textContent = '您今日已抽奖，明天再来吧！';
                btn.disabled = true;
                btn.style.background = 'linear-gradient(145deg, #888, #666)';
                btn.style.cursor = 'not-allowed';
            } else {
                msgEl.textContent = '';
                btn.disabled = false;
                btn.style.background = '';
                btn.style.cursor = 'pointer';
            }
        }

        function markTodaySpun() {
            const auth = getAuth();
            if (auth) {
                const today = new Date().toLocaleDateString('zh-CN');
                localStorage.setItem(LAST_SPIN_KEY + '_' + auth.phone, today);
            }
        }

        // ===== 转盘配置 =====
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 190;

        const SECTOR_COUNT = 20;
        const SECTOR_ANGLE = (Math.PI * 2) / SECTOR_COUNT;

        const sectorTypes = [
            3, 0, 0, 0, 1, 0, 0, 0, 2, 0,
            0, 0, 1, 0, 0, 0, 1, 0, 0, 0
        ];

        const PRIZE_META = {
            0: { name: '谢谢惠顾', color: '#555555', textColor: '#ccc', value: 0, class: 'thanks', prob: 75 },
            1: { name: '三等奖', color: '#CD7F32', textColor: '#fff', value: 2, class: 'third', prob: 15 },
            2: { name: '二等奖', color: '#C0C0C0', textColor: '#333', value: 5, class: 'second', prob: 7 },
            3: { name: '一等奖', color: '#FFD700', textColor: '#8B4513', value: 10, class: 'first', prob: 3 }
        };

        const sectors = sectorTypes.map((type, index) => {
            const meta = PRIZE_META[type];
            const startAngle = index * SECTOR_ANGLE - Math.PI / 2;
            const endAngle = startAngle + SECTOR_ANGLE;
            return {
                index: index,
                type: type,
                ...meta,
                startAngle: startAngle,
                endAngle: endAngle,
                midAngle: startAngle + SECTOR_ANGLE / 2
            };
        });

        const sectorsByType = { 0: [], 1: [], 2: [], 3: [] };
        sectors.forEach(s => sectorsByType[s.type].push(s.index));

        let currentAngle = 0;
        let isSpinning = false;
        let animationId = null;

        // ===== 绘制转盘 =====
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const sector of sectors) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, sector.startAngle + currentAngle, sector.endAngle + currentAngle);
                ctx.closePath();
                ctx.fillStyle = sector.color;
                ctx.fill();

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 纵向文字
                const textAngle = sector.midAngle + currentAngle;
                const chars = sector.name.split('');
                const charSpacing = 20;
                const totalHeight = chars.length * charSpacing;
                const startRadius = radius * 0.58 - totalHeight / 2 + charSpacing / 2;

                chars.forEach((char, i) => {
                    const r = startRadius + i * charSpacing;
                    const cx = centerX + Math.cos(textAngle) * r;
                    const cy = centerY + Math.sin(textAngle) * r;

                    ctx.save();
                    ctx.translate(cx, cy);
                    let rotateAngle = textAngle + Math.PI / 2;
                    ctx.rotate(rotateAngle);
                    ctx.fillStyle = sector.textColor;
                    ctx.font = 'bold 16px "SimSun", serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(char, 0, 0);
                    ctx.restore();
                });

                const dotAngle = sector.midAngle + currentAngle;
                const dotX = centerX + Math.cos(dotAngle) * (radius - 8);
                const dotY = centerY + Math.sin(dotAngle) * (radius - 8);
                ctx.beginPath();
                ctx.arc(dotX, dotY, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.fill();
            }

            ctx.beginPath();
            ctx.arc(centerX, centerY, 48, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 58, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,215,0,0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // ===== 抽奖逻辑 =====
        function drawPrize() {
            const rand = Math.floor(Math.random() * 100) + 1;
            if (rand <= 3) return { type: 3, rand: rand };
            if (rand <= 10) return { type: 2, rand: rand };
            if (rand <= 25) return { type: 1, rand: rand };
            return { type: 0, rand: rand };
        }

        function calculateTargetAngle(targetSectorIndex) {
            const targetSector = sectors[targetSectorIndex];
            const targetMid = -Math.PI / 2;
            const currentMid = targetSector.midAngle + currentAngle;
            let diff = targetMid - currentMid;
            while (diff < 0) diff += Math.PI * 2;
            const extraSpins = 5 + Math.floor(Math.random() * 4);
            diff += extraSpins * Math.PI * 2;
            const randomOffset = (Math.random() - 0.5) * SECTOR_ANGLE * 0.6;
            diff += randomOffset;
            return currentAngle + diff;
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - t, 3);
        }

        function spin() {
            // 检查认证
            const auth = getAuth();
            if (!auth) {
                showAuthModal();
                return;
            }

            // 检查每日限制
            const today = new Date().toLocaleDateString('zh-CN');
            const lastSpin = localStorage.getItem(LAST_SPIN_KEY + '_' + auth.phone);
            if (lastSpin === today) {
                alert('您今日已抽奖，明天再来吧！');
                return;
            }

            if (isSpinning) return;

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            btn.disabled = true;
            btn.classList.add('spinning');

            const result = drawPrize();
            const targetType = result.type;

            const candidateIndices = sectorsByType[targetType];
            const targetSectorIndex = candidateIndices[Math.floor(Math.random() * candidateIndices.length)];

            targetAngle = calculateTargetAngle(targetSectorIndex);

            const startAngle = currentAngle;
            const duration = 4500 + Math.random() * 1000;
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutCubic(progress);

                currentAngle = startAngle + (targetAngle - startAngle) * easedProgress;
                drawWheel();

                if (progress < 1) {
                    animationId = requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    btn.disabled = false;
                    btn.classList.remove('spinning');

                    // 标记今日已抽奖
                    markTodaySpun();
                    checkDailyLimit();

                    const prize = PRIZE_META[targetType];
                    showResult(prize);
                    addRecord(prize);
                    if (targetType !== 0) {
                        createConfetti();
                    }
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        // ===== 结果弹窗 =====
        function showResult(prize) {
            const modal = document.getElementById('resultModal');
            const title = document.getElementById('resultTitle');
            const desc = document.getElementById('resultDesc');
            const buttons = document.getElementById('resultButtons');

            title.className = 'result-title ' + prize.class;

            if (prize.class === 'thanks') {
                title.textContent = '谢谢惠顾';
                desc.textContent = '很遗憾，这次没有中奖，明天再来吧！';
                buttons.innerHTML = '<button class="close-btn" onclick="closeModal()">关闭</button>';
            } else {
                title.textContent = '恭喜获得' + prize.name + '！';
                desc.textContent = '您获得了' + prize.value + '元代金券！\n（每次最多使用一张）';
                buttons.innerHTML = `
                    <button class="download-btn" onclick="generateVoucher('${prize.class}', ${prize.value})">下载代金券</button>
                    <button class="close-btn" onclick="closeModal()">关闭</button>
                `;
            }

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.remove('show');
        }

        // ===== 生成代金券 =====
        function generateVoucher(type, value) {
            const vCanvas = document.createElement('canvas');
            vCanvas.width = 900;
            vCanvas.height = 450;
            const vCtx = vCanvas.getContext('2d');

            const colors = {
                first: { 
                    bg1: '#FFD700', bg2: '#FFA500', 
                    border: '#B8860B', text: '#8B4513', 
                    light: '#FFF8DC', dark: '#DAA520',
                    label: '一等奖'
                },
                second: { 
                    bg1: '#F0F0F0', bg2: '#C0C0C0', 
                    border: '#808080', text: '#333333', 
                    light: '#FFFFFF', dark: '#A0A0A0',
                    label: '二等奖'
                },
                third: { 
                    bg1: '#F4A460', bg2: '#CD7F32', 
                    border: '#8B4513', text: '#FFFFFF', 
                    light: '#FFE4C4', dark: '#A0522D',
                    label: '三等奖'
                }
            };

            const c = colors[type];
            const auth = getAuth();

            const gradient = vCtx.createLinearGradient(0, 0, 900, 450);
            gradient.addColorStop(0, c.bg1);
            gradient.addColorStop(0.5, c.light);
            gradient.addColorStop(1, c.bg2);
            vCtx.fillStyle = gradient;
            vCtx.fillRect(0, 0, 900, 450);

            vCtx.strokeStyle = c.border;
            vCtx.lineWidth = 10;
            vCtx.strokeRect(5, 5, 890, 440);

            vCtx.strokeStyle = c.border;
            vCtx.lineWidth = 2;
            vCtx.setLineDash([12, 8]);
            vCtx.strokeRect(25, 25, 850, 400);
            vCtx.setLineDash([]);

            vCtx.globalAlpha = 0.08;
            vCtx.fillStyle = c.dark;
            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 12; col++) {
                    vCtx.beginPath();
                    vCtx.arc(60 + col * 75, 50 + row * 75, 30, 0, Math.PI * 2);
                    vCtx.fill();
                }
            }
            vCtx.globalAlpha = 1;

            const topGradient = vCtx.createLinearGradient(0, 0, 900, 0);
            topGradient.addColorStop(0, c.dark);
            topGradient.addColorStop(0.5, c.border);
            topGradient.addColorStop(1, c.dark);
            vCtx.fillStyle = topGradient;
            vCtx.fillRect(25, 25, 850, 50);
            vCtx.fillRect(25, 375, 850, 50);

            vCtx.fillStyle = c.light;
            vCtx.font = 'bold 24px "SimSun", serif';
            vCtx.textAlign = 'center';
            vCtx.fillText('公司开源抽奖活动 · 代金券', 450, 58);

            vCtx.save();
            vCtx.translate(55, 225);
            vCtx.rotate(-Math.PI / 2);
            vCtx.fillStyle = c.border;
            vCtx.globalAlpha = 0.3;
            vCtx.font = 'bold 20px "SimSun", serif';
            vCtx.fillText('公司开源抽奖活动专用代金券', 0, 0);
            vCtx.restore();
            vCtx.globalAlpha = 1;

            vCtx.save();
            vCtx.translate(845, 225);
            vCtx.rotate(Math.PI / 2);
            vCtx.fillStyle = c.border;
            vCtx.globalAlpha = 0.3;
            vCtx.font = 'bold 20px "SimSun", serif';
            vCtx.fillText('公司开源抽奖活动专用代金券', 0, 0);
            vCtx.restore();
            vCtx.globalAlpha = 1;

            vCtx.fillStyle = c.text;
            vCtx.font = 'bold 52px "SimSun", serif';
            vCtx.textAlign = 'center';
            vCtx.fillText('代 金 券', 450, 130);

            vCtx.strokeStyle = c.border;
            vCtx.lineWidth = 2;
            vCtx.beginPath();
            vCtx.moveTo(320, 145);
            vCtx.lineTo(580, 145);
            vCtx.stroke();

            vCtx.fillStyle = c.text;
            vCtx.font = 'bold 140px "SimSun", serif';
            vCtx.fillText('¥' + value, 450, 260);

            vCtx.fillStyle = 'rgba(0,0,0,0.1)';
            vCtx.fillText('¥' + value, 454, 264);
            vCtx.fillStyle = c.text;
            vCtx.fillText('¥' + value, 450, 260);

            vCtx.fillStyle = c.border;
            vCtx.font = 'bold 28px "SimSun", serif';
            vCtx.fillText(c.label, 450, 310);

            // 持券人信息
            vCtx.fillStyle = c.text;
            vCtx.font = '16px "SimSun", serif';
            vCtx.fillText('持券人：' + (auth ? auth.name : '未知'), 450, 340);

            const date = new Date();
            const expireDate = new Date(date.getTime() + 30 * 24 * 60 * 60 * 1000);
            vCtx.font = '18px "SimSun", serif';
            vCtx.fillText('有效期至：' + expireDate.toLocaleDateString('zh-CN'), 450, 365);

            vCtx.font = '14px "SimSun", serif';
            vCtx.fillStyle = c.border;
            vCtx.fillText('每次最多使用一张 · 不可找零 · 不可兑换现金', 450, 390);

            const serialNo = 'NO.' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).substring(2, 6).toUpperCase();
            vCtx.font = '14px "SimSun", serif';
            vCtx.fillText(serialNo, 450, 415);

            vCtx.strokeStyle = c.border;
            vCtx.lineWidth = 4;
            const cornerSize = 25;
            const corners = [
                [25, 25], [875, 25], [25, 425], [875, 425]
            ];
            corners.forEach(([x, y]) => {
                const dx = x < 450 ? 1 : -1;
                const dy = y < 225 ? 1 : -1;
                vCtx.beginPath();
                vCtx.moveTo(x, y + dy * cornerSize);
                vCtx.lineTo(x, y);
                vCtx.lineTo(x + dx * cornerSize, y);
                vCtx.stroke();
            });

            const link = document.createElement('a');
            link.download = '代金券_' + value + '元_' + (auth ? auth.name : '未知') + '.png';
            link.href = vCanvas.toDataURL('image/png');
            link.click();
        }

        // ===== 记录管理 =====
        function getRecords() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) { return []; }
        }

        function saveRecords(records) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        }

        function addRecord(prize) {
            const auth = getAuth();
            const records = getRecords();
            const record = {
                prize: prize.name,
                value: prize.value || 0,
                class: prize.class,
                time: new Date().toLocaleString('zh-CN'),
                user: auth ? auth.name : '未知',
                phone: auth ? auth.phone : ''
            };
            records.unshift(record);
            if (records.length > 100) records.pop();
            saveRecords(records);
            renderRecords();
            updateStats();
        }

        function renderRecords() {
            const list = document.getElementById('recordList');
            const records = getRecords();

            if (records.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#666;padding:40px 0;font-family:SimSun,serif;">暂无记录</div>';
                return;
            }

            list.innerHTML = records.map(r => `
                <div class="record-item ${r.class}">
                    <div>
                        <div class="record-prize">${r.prize}${r.value > 0 ? ' (¥' + r.value + ')' : ''}</div>
                        <div class="record-time">${r.time}${r.user ? ' · ' + r.user : ''}</div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            const records = getRecords();
            const stats = { first: 0, second: 0, third: 0, thanks: 0 };
            records.forEach(r => { if (stats[r.class] !== undefined) stats[r.class]++; });

            document.getElementById('statFirst').textContent = stats.first;
            document.getElementById('statSecond').textContent = stats.second;
            document.getElementById('statThird').textContent = stats.third;
            document.getElementById('statThanks').textContent = stats.thanks;
        }

        function clearRecords() {
            if (confirm('确定要清空所有中奖记录吗？此操作不可恢复。')) {
                localStorage.removeItem(STORAGE_KEY);
                renderRecords();
                updateStats();
            }
        }

        // ===== 彩带效果 =====
        function createConfetti() {
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#FF69B4'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = Math.random() * 12 + 6 + 'px';
                confetti.style.height = Math.random() * 12 + 6 + 'px';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(confetti);

                const duration = 2500 + Math.random() * 2000;
                const xEnd = (Math.random() - 0.5) * 300;

                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${xEnd}px, ${window.innerHeight}px) rotate(${720 + Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                }).onfinish = () => confetti.remove();
            }
        }

        // 点击模态框外部关闭结果弹窗
        document.getElementById('resultModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
